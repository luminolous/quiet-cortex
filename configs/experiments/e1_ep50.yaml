# E1 one-factor-at-a-time: epochs = 50; everything else as e1_baseline.
run_id: e1_ep50
experiment: E1
change: epochs = 50
model: yolo11n
data: configs/data_5class.yaml
seed: 0
train:
  epochs: 50
  patience: 20
  imgsz: 640
  batch: 16
  optimizer: SGD
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
