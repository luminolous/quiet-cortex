# E3: selected model and configuration (YOLO11n, e1_baseline) retrained on the 2-class setting.
run_id: e3_2class
experiment: E3
change: data = 2 classes (ERD_C4, ERD_C3; left/right-hand groups)
model: yolo11n
data: configs/data_2class.yaml
seed: 0
train:
  epochs: 100
  patience: 20
  imgsz: 640
  batch: 16
  optimizer: SGD
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
